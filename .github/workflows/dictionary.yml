name: dictionary

on:
  push:
    branches: ['**']
  pull_request:
  schedule:
    # 매주 월요일 03:00 UTC — 온라인 수집으로 사전을 갱신한다.
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  verify:
    name: 타입체크 · 테스트 · 오프라인 빌드
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run dict:build
      - name: 산출물 업로드
        uses: actions/upload-artifact@v4
        with:
          name: dictionary-offline
          path: data/dist/

  refresh:
    name: 온라인 수집으로 사전 갱신
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # 아래 마지막 스텝이 코퍼스 파일을 이 브랜치에 직접 커밋+푸시하므로 필요하다.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: 증분 빌드(온라인)
        env:
          KOREAN_DICT_API_KEY: ${{ secrets.KOREAN_DICT_API_KEY }}
        run: npx tsx src/cli.ts build --online --incremental
      - run: npx tsx src/cli.ts stats
      - name: 산출물 업로드
        uses: actions/upload-artifact@v4
        with:
          name: dictionary-online
          path: data/dist/
          retention-days: 30
      - name: 온라인 수집 결과를 코퍼스로 내보내 커밋
        # 이 커밋 없이는 온라인 수집 결과가 이 CI job 안에서만 존재하다 사라진다 —
        # GitHub Pages 배포(pages.yml)는 항상 오프라인 빌드만 하므로, 이렇게
        # 저장소에 실제로 커밋해 둬야 배포된 사이트에도 반영된다.
        run: |
          node scripts/exportKoreanDictCorpus.mjs
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/corpus/korean-words.tsv
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "chore(dict): 우리말샘 온라인 수집 결과 갱신 (자동)"
            git push
          fi
