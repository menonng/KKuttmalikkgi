<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>끝말잇기 아레나</title>

<style>
    :root {
        --bg: #f4f2ee;
        --surface: #ffffff;
        --surface-soft: #f7f6f3;
        --ink: #1d2327;
        --muted: #777;
        --line: #202020;
        --red: #962b28;
        --pink: #f0d9e4;
        --silver: #ededee;
        --shadow: 0 7px 0 var(--line);
    }

    /* =========================================================
       SECRET THEME (easter egg: 19911018mafumafu)
       Swaps the whole palette to the four secret colors.
       ========================================================= */
    body.secret {
        --bg: #f0d9e4;
        --surface: #eeedf2;
        --surface-soft: #f0d9e4;
        --ink: #1d2327;
        --muted: #962b28;
        --line: #1d2327;
        --red: #962b28;
        --pink: #eeedf2;
        --silver: #eeedf2;
        --shadow: 0 7px 0 var(--line);
    }

    body.secret .ai {
        background: #962b28;
    }

    body.secret .multiplayer {
        background: #1d2327;
    }

    body.secret .modal-nav button.active,
    body.secret .primary-button {
        background: #962b28;
        color: #eeedf2;
    }

    body.secret .toggle.on {
        background: #f0d9e4;
    }

    * {
        box-sizing: border-box;
    }

    html,
    body {
        width: 100%;
        height: 100%;
        margin: 0;
    }

    body {
        background: var(--bg);
        color: var(--ink);
        transition:
            background 220ms ease,
            color 220ms ease;
        font-family:
            "Pretendard",
            "Noto Sans KR",
            "Noto Sans",
            Arial,
            Helvetica,
            sans-serif;
        overflow: hidden;
    }

    button,
    input {
        font: inherit;
    }

    button {
        color: inherit;
    }

    .app {
        width: 100%;
        height: 100%;
        display: grid;
        grid-template-columns: 280px minmax(0, 1fr) 180px;
        gap: 24px;
        padding: 24px;
    }

    .column {
        min-width: 0;
        min-height: 0;
    }

    .card {
        background: var(--surface);
        border: 4px solid var(--line);
        border-radius: 18px;
        box-shadow: var(--shadow);
    }

    /* =========================================================
       LEFT COLUMN
       ========================================================= */

    .left-column {
        display: flex;
        flex-direction: column;
        gap: 16px;
    }

    .profile-card {
        padding: 18px;
    }

    .avatar {
        width: 82px;
        height: 82px;
        border: 4px solid var(--line);
        border-radius: 16px;
        background: var(--silver);
        display: grid;
        place-items: center;
        font-size: 12px;
        font-weight: 800;
        overflow: hidden;
    }

    .profile-name {
        margin-top: 14px;
        font-size: 26px;
        font-weight: 900;
        letter-spacing: -0.8px;
    }

    .profile-sub {
        margin-top: 4px;
        color: var(--muted);
        font-size: 13px;
    }

    .record-card {
        flex: 1;
        min-height: 0;
        padding: 18px;
    }

    .section-label {
        margin: 0 0 14px;
        font-size: 14px;
        font-weight: 900;
        letter-spacing: 0.08em;
        text-transform: uppercase;
    }

    .record-empty {
        color: var(--muted);
        font-size: 14px;
        line-height: 1.6;
    }

    /* =========================================================
       CENTER COLUMN
       ========================================================= */

    .center-column {
        display: flex;
        flex-direction: column;
        min-width: 0;
    }

    .brand {
        text-align: center;
        padding: 0 20px 18px;
    }

    .brand h1 {
        margin: 0;
        font-size: clamp(48px, 5vw, 72px);
        line-height: 0.95;
        font-weight: 950;
        letter-spacing: -3px;
        white-space: nowrap;
    }

    .brand p {
        margin: 12px 0 0;
        font-size: 15px;
        color: var(--muted);
        letter-spacing: 0.18em;
        text-transform: uppercase;
    }

    .featured-card {
        min-height: 116px;
        padding: 16px 20px;
        margin-bottom: 20px;
    }

    .featured-caption {
        font-size: 11px;
        font-weight: 900;
        letter-spacing: 0.12em;
        color: var(--muted);
        text-transform: uppercase;
    }

    .featured-word {
        margin-top: 4px;
        font-size: 32px;
        font-weight: 950;
        letter-spacing: -1.2px;
    }

    .featured-lore {
        margin-top: 3px;
        color: var(--muted);
        font-size: 13px;
    }

    .main-actions {
        flex: 1;
        min-height: 0;
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 20px;
    }

    .action-card {
        position: relative;
        min-height: 260px;
        padding: 28px;
        overflow: hidden;
        cursor: pointer;
        user-select: none;
        transition:
            transform 150ms ease,
            box-shadow 150ms ease;
    }

    .action-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 12px 0 var(--line);
    }

    .action-card:active {
        transform: translateY(2px);
        box-shadow: 0 4px 0 var(--line);
    }

    .multiplayer {
        background: var(--red);
        color: #fff;
    }

    .ai {
        background: var(--ink);
        color: #fff;
    }

    .action-tag {
        font-size: 11px;
        font-weight: 900;
        letter-spacing: 0.16em;
        opacity: 0.75;
    }

    .action-title {
        margin-top: 18px;
        font-size: clamp(34px, 3.4vw, 52px);
        line-height: 0.95;
        font-weight: 950;
        letter-spacing: -2px;
    }

    .action-description {
        margin-top: 16px;
        font-size: 15px;
        opacity: 0.9;
        max-width: 270px;
        line-height: 1.5;
    }

    .action-foot {
        position: absolute;
        left: 28px;
        bottom: 24px;
        font-size: 13px;
        opacity: 0.82;
    }

    /* =========================================================
       RIGHT COLUMN
       ========================================================= */

    .right-column {
        display: flex;
        flex-direction: column;
        gap: 12px;
    }

    .utility-button {
        min-height: 56px;
        padding: 12px 14px;
        display: grid;
        place-items: center;
        border: 4px solid var(--line);
        border-radius: 15px;
        background: var(--surface);
        box-shadow: 0 5px 0 var(--line);
        font-size: 14px;
        font-weight: 900;
        cursor: pointer;
        transition:
            transform 120ms ease,
            box-shadow 120ms ease,
            background 120ms ease;
    }

    .utility-button:hover {
        transform: translateX(-4px);
    }

    .utility-button:active {
        transform: translateY(2px);
        box-shadow: 0 2px 0 var(--line);
    }

    .utility-spacer {
        flex: 1;
    }

    /* =========================================================
       MODAL SYSTEM
       ========================================================= */

    .modal-backdrop {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: rgba(0, 0, 0, 0.38);
        backdrop-filter: blur(6px);
    }

    .modal-backdrop.open {
        display: flex;
    }

    .modal {
        width: min(920px, 92vw);
        max-height: min(780px, 88vh);
        overflow: auto;
        padding: 24px;
        background: var(--surface);
        border: 4px solid var(--line);
        border-radius: 20px;
        box-shadow: 0 10px 0 var(--line);
        transition: width 160ms ease, max-height 160ms ease;
    }

    /* AI 대전은 캐릭터/체력바/단어 로그가 한 화면에 다 들어가야 해서
       일반 모달보다 훨씬 넓게 쓴다("분할 화면을 넓히거나 새 창으로" 요구사항 대응). */
    .modal.match-modal {
        width: min(1360px, 97vw);
        max-height: min(900px, 95vh);
    }

    .modal-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 20px;
    }

    .modal-title {
        margin: 0;
        font-size: 32px;
        font-weight: 950;
    }

    .close-button {
        width: 42px;
        height: 42px;
        border: 3px solid var(--line);
        border-radius: 12px;
        background: var(--surface-soft);
        cursor: pointer;
        font-size: 20px;
        font-weight: 900;
    }

    .modal-grid {
        display: grid;
        grid-template-columns: 180px minmax(0, 1fr);
        gap: 18px;
    }

    .modal-nav {
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    .modal-nav button {
        padding: 11px 12px;
        border: 3px solid var(--line);
        border-radius: 11px;
        background: var(--surface-soft);
        cursor: pointer;
        text-align: left;
        font-weight: 800;
    }

    .modal-nav button.active {
        background: var(--red);
        color: white;
    }

    .modal-panel {
        min-height: 340px;
        padding: 18px;
        border: 3px solid var(--line);
        border-radius: 14px;
        background: var(--surface-soft);
    }

    .search-row {
        display: flex;
        gap: 10px;
    }

    .search-row input {
        flex: 1;
        min-width: 0;
        padding: 12px 14px;
        border: 3px solid var(--line);
        border-radius: 10px;
        background: white;
    }

    .primary-button {
        padding: 12px 16px;
        border: 3px solid var(--line);
        border-radius: 10px;
        background: var(--red);
        color: white;
        cursor: pointer;
        font-weight: 900;
    }

    .room-actions {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
        margin-top: 16px;
    }

    .room-button {
        padding: 18px;
        border: 3px solid var(--line);
        border-radius: 14px;
        background: white;
        cursor: pointer;
        text-align: left;
    }

    .room-button strong {
        display: block;
        font-size: 20px;
        margin-bottom: 5px;
    }

    .setting-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 14px 0;
        border-bottom: 1px solid #d5d5d5;
    }

    .profile-section {
        margin-top: 20px;
        padding-top: 16px;
        border-top: 1px solid #d5d5d5;
    }

    .profile-color-grid {
        display: grid;
        grid-template-columns: repeat(7, minmax(0, 1fr));
        gap: 8px;
        max-width: 320px;
    }

    .profile-color-swatch {
        width: 36px;
        height: 36px;
        border-radius: 10px;
        border: 3px solid var(--line);
        cursor: pointer;
        transition: transform 100ms ease;
    }

    .profile-color-swatch:hover {
        transform: scale(1.1);
    }

    .profile-color-swatch.selected {
        box-shadow: 0 0 0 3px var(--red);
    }

    .toggle {
        min-width: 74px;
        padding: 8px 10px;
        border: 3px solid var(--line);
        border-radius: 999px;
        background: white;
        cursor: pointer;
        font-weight: 900;
    }

    .toggle.on {
        background: var(--pink);
    }

    /* =========================================================
       AI MATCH SCREEN
       ========================================================= */

    .match-hud {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
        margin-bottom: 12px;
        font-size: 13px;
        font-weight: 800;
        color: var(--muted);
    }

    .match-hp {
        display: flex;
        gap: 4px;
        font-size: 18px;
        letter-spacing: 2px;
    }

    .match-hp .lost {
        opacity: 0.25;
    }

    .match-speed {
        padding: 3px 10px;
        border: 2px solid var(--line);
        border-radius: 999px;
        background: var(--surface-soft);
    }

    .match-timer-track {
        height: 10px;
        border: 3px solid var(--line);
        border-radius: 999px;
        background: var(--surface-soft);
        overflow: hidden;
        margin-bottom: 18px;
    }

    .match-timer-fill {
        height: 100%;
        background: var(--red);
        transform-origin: left;
        transition: transform 100ms linear, background 200ms ease;
    }

    .match-timer-fill.urgent {
        background: #d94a2f;
    }

    .match-word-stage {
        text-align: center;
        padding: 20px 12px;
    }

    .match-turn-label {
        font-size: 12px;
        font-weight: 900;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.1em;
    }

    .match-current-word {
        margin-top: 6px;
        font-size: 40px;
        font-weight: 950;
        letter-spacing: -1px;
    }

    .match-hint-char {
        color: var(--red);
    }

    .match-status {
        margin-top: 6px;
        min-height: 20px;
        font-size: 13px;
        color: var(--muted);
    }

    .match-input-row {
        display: flex;
        gap: 10px;
        margin-top: 4px;
    }

    .match-input-row input {
        flex: 1;
        min-width: 0;
        padding: 12px 14px;
        border: 3px solid var(--line);
        border-radius: 10px;
        background: white;
        font-size: 16px;
    }

    .match-input-row input:disabled {
        background: var(--surface-soft);
        color: var(--muted);
    }

    .match-log {
        margin-top: 18px;
        display: flex;
        gap: 8px;
        overflow-x: auto;
        padding-bottom: 4px;
    }

    .match-log-word {
        flex-shrink: 0;
        padding: 6px 12px;
        border: 2px solid var(--line);
        border-radius: 999px;
        font-size: 13px;
        font-weight: 800;
        background: white;
        white-space: nowrap;
    }

    .match-log-word.ai {
        background: var(--ink);
        color: white;
    }

    .match-log-word.special {
        /* applyPace() 가 갱신하는 --pace-ratio 를 그대로 나눠 쓴다 — 타이머가
           빨라지는 비율과 정확히 같은 비율로 이 펄스도 빨라진다. */
        animation: match-special-pulse calc(900ms / var(--pace-ratio, 1)) ease-in-out infinite;
    }

    @keyframes match-special-pulse {
        0%, 100% {
            box-shadow: 0 0 0 0 rgba(150, 43, 40, 0.35);
        }
        50% {
            box-shadow: 0 0 0 5px rgba(150, 43, 40, 0);
        }
    }

    .match-result {
        margin-top: 18px;
        padding: 16px;
        border: 3px solid var(--line);
        border-radius: 14px;
        text-align: center;
    }

    .match-result.win {
        background: #e4f2e6;
    }

    .match-result.lose {
        background: #fbe4e2;
    }

    .match-result h4 {
        margin: 0 0 6px;
        font-size: 22px;
        font-weight: 950;
    }

    .match-result-actions {
        margin-top: 12px;
        display: flex;
        gap: 10px;
        justify-content: center;
    }

    .match-bgm-toggle {
        border: 2px solid var(--line);
        border-radius: 999px;
        padding: 4px 12px;
        background: var(--surface-soft);
        cursor: pointer;
        font-size: 12px;
        font-weight: 800;
    }

    /* =========================================================
       CHARACTERS — 단어 로그 하단에 배치되는 두 캐릭터와 체력바.
       ========================================================= */

    .character-stage {
        margin-top: 16px;
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 20px;
    }

    .character-slot {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 18px 10px 14px;
        border: 3px solid var(--line);
        border-radius: 16px;
        background: var(--surface-soft);
        overflow: visible;
    }

    .character-slot.defeated {
        opacity: 0.35;
        filter: grayscale(1);
    }

    .character-name {
        font-size: 12px;
        font-weight: 900;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.06em;
        margin-bottom: 8px;
    }

    .character-rig {
        position: relative;
        width: 84px;
        height: 84px;
        margin-top: 54px;
    }

    /* 끝이 약간 둥근 정사각형 + 적절한 위치의 눈 2개. */
    .character-body {
        position: absolute;
        inset: 0;
        border-radius: 26%;
        border: 4px solid var(--line);
        background: var(--character-color, #f0d9e4);
        box-shadow: inset 0 -6px 0 rgba(0, 0, 0, 0.12);
        --hit-amp: 1;
    }

    .character-eye {
        position: absolute;
        top: 34%;
        width: 16%;
        height: 16%;
        border-radius: 50%;
        background: var(--character-eye-color, #ffffff);
        border: 2px solid var(--line);
    }

    .character-eye::after {
        content: "";
        position: absolute;
        top: 30%;
        left: 30%;
        width: 45%;
        height: 45%;
        border-radius: 50%;
        background: var(--line);
    }

    .character-eye.left {
        left: 26%;
    }

    .character-eye.right {
        right: 26%;
    }

    .character-body.hit {
        /* JS 가 hitPlan/estimateHitSequenceMs 결과로 --hit-duration 을 채운다
           (20 초과 피해는 1초 이상 걸리도록 health.ts 와 공식을 공유한다). */
        animation: character-recoil var(--hit-duration, 220ms) ease-out;
    }

    @keyframes character-recoil {
        0% {
            transform: translate(0, 0) rotate(0deg);
            filter: brightness(1);
        }
        30% {
            transform: translate(calc(3px * var(--hit-amp, 1)), calc(5px * var(--hit-amp, 1)))
                rotate(calc(-3deg * var(--hit-amp, 1)));
            filter: brightness(1.7) saturate(1.3);
        }
        60% {
            transform: translate(calc(-2px * var(--hit-amp, 1)), calc(1px * var(--hit-amp, 1)))
                rotate(calc(2deg * var(--hit-amp, 1)));
        }
        100% {
            transform: translate(0, 0) rotate(0deg);
            filter: brightness(1);
        }
    }

    /* 굉장히 허접하고 대충 만든 느낌이지만 아주 역동적인 발작 -> 적색화 -> 폭발. */
    .character-body.dying {
        animation:
            character-death-jitter 90ms steps(1) 9,
            character-death-redden 760ms ease-in forwards;
    }

    @keyframes character-death-jitter {
        0% { transform: translate(0, 0) rotate(0deg) scale(1); }
        11% { transform: translate(-7px, 4px) rotate(-11deg) scale(1.03); }
        22% { transform: translate(8px, -5px) rotate(13deg) scale(0.97); }
        33% { transform: translate(-9px, 6px) rotate(-15deg) scale(1.05); }
        44% { transform: translate(10px, -4px) rotate(12deg) scale(0.95); }
        55% { transform: translate(-8px, 5px) rotate(-13deg) scale(1.04); }
        66% { transform: translate(9px, -6px) rotate(14deg) scale(0.96); }
        77% { transform: translate(-10px, 3px) rotate(-16deg) scale(1.06); }
        88% { transform: translate(6px, -4px) rotate(9deg) scale(0.98); }
        100% { transform: translate(0, 0) rotate(0deg) scale(1); }
    }

    @keyframes character-death-redden {
        0% { filter: brightness(1) saturate(1); }
        100% {
            filter: brightness(1.5) saturate(2.4);
            background: #ff2b2b !important;
        }
    }

    /* 폭발 순간엔 슬롯 전체(캐릭터+체력바)를 통째로 날려버린다 — 밈처럼 허접하지만
       역동적으로. JS(playDeathSequence)가 슬롯을 document.body 로 옮기고
       position: fixed 로 고정한 뒤 이 클래스를 붙이므로, 모달의 overflow: auto
       에 갇히지 않고 화면 전체를 가로질러 날아갈 수 있다("무빙이 굳이 창 안에
       갇혀 있을 필요는 없어" 요구사항). --fly-x/--fly-y 는 매번 무작위 방향으로
       JS 가 정한다.
    */
    .character-slot.exploding {
        animation: character-explode 650ms cubic-bezier(0.22, 0.9, 0.3, 1) forwards;
        pointer-events: none;
    }

    @keyframes character-explode {
        0% { transform: translate(0, 0) scale(1) rotate(0deg); opacity: 1; }
        22% { transform: translate(calc(var(--fly-x, 0px) * 0.06), calc(var(--fly-y, 0px) * 0.06)) scale(1.45) rotate(-16deg); opacity: 1; }
        100% {
            transform: translate(var(--fly-x, 0px), var(--fly-y, 0px)) scale(0.25) rotate(560deg);
            opacity: 0;
        }
    }

    .character-shard {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 10px;
        height: 10px;
        border: 2px solid var(--line);
        background: var(--character-color, #f0d9e4);
        border-radius: 3px;
        pointer-events: none;
        animation: character-shard-fly 480ms ease-out forwards;
    }

    @keyframes character-shard-fly {
        0% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        100% {
            transform: translate(calc(-50% + var(--shard-x, 0px)), calc(-50% + var(--shard-y, 0px))) scale(0.2);
            opacity: 0;
        }
    }

    /* 캐릭터(84px)보다 눈에 띄게 크게 — 항상 보이는 소품으로 캐릭터 옆에 걸려 있다가
       피격 순간에 실제로 내려친다("망치가 실제로 보여야" 요구사항). */
    .character-hammer {
        position: absolute;

<script>
/* ============================================================
   DICTIONARY DATA LAYER

   Loads the built dictionary (data/dictionary.json) and, for any
   word it doesn't contain, searches Wikipedia / the Genshin Impact
   fandom wiki / Wiktionary live to confirm the word actually exists
   before accepting it. This is the real implementation backing the
   DICTIONARY window's search box below — see src/service/browser.ts
   for the resolver itself (dist/service/browser.js is the compiled,
   dependency-free ESM build loaded here via dynamic import()).

   No bundler is involved: tsc emits plain relative ESM imports, so
   this file is loadable directly by the browser from dist/.
   ============================================================ */

let dictionaryHandlePromise = null;

/** Lazily loads + caches the resolver. Safe to call many times. */
function getDictionaryHandle() {
    if (!dictionaryHandlePromise) {
        dictionaryHandlePromise = import("./dist/service/browser.js")
            .then(({ createBrowserResolver }) =>
                createBrowserResolver({ dictionaryUrl: "./data/dictionary.json" })
            )
            .then((handle) => {
                updateFeaturedWord(handle);
                return handle;
            })
            .catch((error) => {
                console.error("[dictionary] failed to initialize resolver:", error);
                const wordEl = document.getElementById("featuredWord");
                const loreEl = document.getElementById("featuredLore");
                if (wordEl) wordEl.textContent = "사전을 불러오지 못했습니다";
                if (loreEl) loreEl.textContent = "네트워크 연결을 확인해 주세요.";
                throw error;
            });
    }
    return dictionaryHandlePromise;
}

/** Picks a random entry from the loaded dictionary for the "오늘의 단어" card. */
function updateFeaturedWord(handle) {
    const wordEl = document.getElementById("featuredWord");
    const loreEl = document.getElementById("featuredLore");
    if (!wordEl || !loreEl) return;

    const entry = handle.dictionary.randomStartWord();
    if (!entry) {
        wordEl.textContent = "사전이 비어 있습니다";
        loreEl.textContent = "먼저 dictbuild build 로 사전을 생성하세요.";
        return;
    }
    wordEl.textContent = entry.word;
    loreEl.textContent = entry.lore;
}

// Kick off loading as soon as the page runs, so the first search inside
// the modal doesn't have to wait for the initial fetch + module import.
getDictionaryHandle();

const RECENT_SEARCH_KEY = "kkuttmal:recentSearches";

function loadRecentSearches() {
    try {
        const raw = localStorage.getItem(RECENT_SEARCH_KEY);
        return raw ? JSON.parse(raw) : [];
    } catch {
        return [];
    }
}

function pushRecentSearch(word) {
    try {
        const list = loadRecentSearches().filter((item) => item !== word);
        list.unshift(word);
        localStorage.setItem(RECENT_SEARCH_KEY, JSON.stringify(list.slice(0, 8)));
    } catch {
        // Private browsing / storage full — recent search history is a
        // convenience only, so failing to persist it is not an error.
    }
}

function escapeHtml(text) {
    return String(text ?? "").replace(/[&<>"']/gu, (ch) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;",
    }[ch]));
}

function renderRecentChips() {
    const container = document.getElementById("dictionaryRecent");
    if (!container) return;

    const list = loadRecentSearches();
    container.innerHTML = list
        .map((word) => `<button class="recent-chip" data-word="${escapeHtml(word)}">${escapeHtml(word)}</button>`)
        .join("");

    container.querySelectorAll("[data-word]").forEach((chip) => {
        chip.addEventListener("click", () => {
            const input = document.getElementById("dictionaryInput");
            if (input) input.value = chip.dataset.word;
            runDictionarySearch(chip.dataset.word);
        });
    });
}

/** Wires up the search box inside the DICTIONARY modal. Called from openModal(). */
function initDictionaryModal() {
    const input = document.getElementById("dictionaryInput");
    const button = document.getElementById("dictionarySearchButton");
    if (!input || !button) return;

    renderRecentChips();

    const run = () => {
        const word = input.value.trim();
        if (word) runDictionarySearch(word);
    };

    button.addEventListener("click", run);
    input.addEventListener("keydown", (event) => {
        if (event.key === "Enter") run();
    });
    input.focus();
}

const LOOKUP_STATUS_LABEL = {
    known: { badge: "ok", text: "사용 가능" },
    resolved: { badge: "ok", text: "사용 가능" },
    unknown: { badge: "ng", text: "사전에 없음" },
    invalid: { badge: "warn", text: "형식 오류" },
};

const LOOKUP_ORIGIN_LABEL = {
    dictionary: "등록된 사전에서 확인됨",
    online: "실시간 검색으로 확인됨",
    cache: "이전 검색 결과",
};

/** Renders one Resolution (from DictionaryResolver.resolve) as a result card. */
function renderLookupResult(resolution) {
    const status = LOOKUP_STATUS_LABEL[resolution.status] ?? { badge: "warn", text: "알 수 없음" };
    const cardClass = status.badge === "ok" ? "lookup-card" : "lookup-card ng";

    if (resolution.status === "invalid" || resolution.status === "unknown") {
        return `
            <div class="${cardClass}">
                <div class="lookup-top">
                    <span class="lookup-word">${escapeHtml(resolution.word)}</span>
                    <span class="lookup-badge ${status.badge}">${status.text}</span>
                </div>
                <div class="lookup-reason">${escapeHtml(resolution.reason || "")}</div>
            </div>
        `;
    }

    const entry = resolution.entry;
    const chips = entry.sources
        .map((source) => `<span class="lookup-chip">${escapeHtml(source)}</span>`)
        .join("");

    return `
        <div class="${cardClass}">
            <div class="lookup-top">
                <span class="lookup-word">${escapeHtml(entry.word)}</span>
                <span class="lookup-badge ${status.badge}">${status.text}</span>
            </div>
            <div class="lookup-lore">${escapeHtml(entry.lore)}</div>
            <div class="lookup-meta">
                ${chips}
                <span class="lookup-origin">${LOOKUP_ORIGIN_LABEL[resolution.origin] ?? ""}</span>
            </div>
        </div>
    `;
}

/** 입력 문자열을 포함하는 모든 등록 단어를 카드 목록으로 그린다(즉시, 로컬 조회). */
function renderSearchList(entries, query) {
    if (entries.length === 0) {
        return `<div class="lookup-empty">'${escapeHtml(query)}'을(를) 포함하는 등록 단어가 없습니다.</div>`;
    }
    const cards = entries
        .map((entry) => {
            const chips = entry.sources
                .map((source) => `<span class="lookup-chip">${escapeHtml(source)}</span>`)
                .join("");
            return `
                <div class="lookup-card">
                    <div class="lookup-top">
                        <span class="lookup-word">${escapeHtml(entry.word)}</span>
                    </div>
                    <div class="lookup-lore">${escapeHtml(entry.lore)}</div>
                    <div class="lookup-meta">${chips}</div>
                </div>
            `;
        })
        .join("");
    return `<div class="lookup-count">'${escapeHtml(query)}' 포함 단어 ${entries.length}개</div>${cards}`;
}

/**
 * 검색을 실행한다. 두 단계로 나눠 "즉시" 를 보장한다:
 *   1) 로컬 사전 포함 검색 — Map/배열 조회뿐이라 사실상 즉시 끝난다. 입력을
 *      포함하는 모든 단어를 곧바로 보여준다.
 *   2) 입력한 단어 자체가 로컬에 정확히 등록돼 있지 않을 때만, 그 한 단어에 한해
 *      온라인 확인을 백그라운드로 추가 실행한다(느릴 수 있으므로 목록 렌더링을
 *      막지 않는다). 확인되면 즉시 학습되어 다음부터는 이 브라우저에서 로컬로 잡힌다.
 */
async function runDictionarySearch(word) {
    const results = document.getElementById("dictionaryResults");
    const exactBox = document.getElementById("dictionaryExactResult");
    if (!results) return;

    const handle = await getDictionaryHandle();

    // 1) 즉시 — 로컬 포함 검색.
    const matches = handle.dictionary.search(word, { limit: 30 });
    results.innerHTML = renderSearchList(matches, word);

    const exactLocal = handle.dictionary.get(word);
    if (exactLocal) {
        pushRecentSearch(exactLocal.word);
        renderRecentChips();
        if (exactBox) exactBox.innerHTML = "";
        return;
    }

    // 2) 로컬에 정확히 없을 때만 — 백그라운드 온라인 확인.
    if (!exactBox) return;
    exactBox.innerHTML = `
        <div class="lookup-loading">
            <span class="lookup-spinner"></span>
            '${escapeHtml(word)}' 자체는 등록돼 있지 않아 온라인에서 추가로 확인 중…
        </div>
    `;

    try {
        const resolution = await handle.resolver.resolve(word);
        exactBox.innerHTML = renderLookupResult(resolution);

        if (resolution.status === "resolved") {
            pushRecentSearch(resolution.entry.word);
            renderRecentChips();
            // 방금 학습된 단어를 포함 검색 목록에도 반영한다.
            results.innerHTML = renderSearchList(handle.dictionary.search(word, { limit: 30 }), word);
        }
    } catch (error) {
        console.error("[dictionary] online lookup failed:", error);
        exactBox.innerHTML = `
            <div class="lookup-card ng">
                <div class="lookup-top">
                    <span class="lookup-word">${escapeHtml(word)}</span>
                    <span class="lookup-badge warn">오류</span>
                </div>
                <div class="lookup-reason">온라인 확인 중 문제가 발생했습니다.</div>
            </div>
        `;
    }
}

/* ============================================================
   AI MATCH ENGINE

   Real single-player word-chain match against a heuristic AI
   opponent (src/game/ai.ts). Turn pacing follows src/game/pace.ts:
   the timer starts at 13s and shortens by 0.3s per turn (floor 2s),
   and the procedural BGM tempo + special-word pulse animation speed
   up by that exact same ratio — see paceSpeedRatio().

   No external BGM asset is bundled (none was supplied and the repo
   avoids embedding third-party media); instead a tiny Web Audio
   arpeggio sequencer plays procedurally so "BGM speed" is something
   that actually runs rather than a inert stub.
   ============================================================ */

let paceModulePromise = null;
function getPaceModule() {
    if (!paceModulePromise) paceModulePromise = import("./dist/game/pace.js");
    return paceModulePromise;
}

let aiModulePromise = null;
function getAiModule() {
    if (!aiModulePromise) aiModulePromise = import("./dist/game/ai.js");
    return aiModulePromise;
}

const DIFFICULTY_LABEL = { easy: "쉬움", normal: "보통", hard: "어려움", insane: "광기" };

/** 현재 진행 중인 매치의 전체 상태. 모달이 닫히면 stopMatch() 로 정리된다. */
let match = null;

/* ============================================================
   설정 & 프로필 저장소

   토글은 전부 "켜짐"/"꺼짐" 으로 통일한다(ON/OFF 표기 혼용 금지).
   ============================================================ */

const SETTINGS_KEY = "kkuttmal:settings";
const DEFAULT_SETTINGS = {
    oneShotWords: false,   // 한방단어 허용
    soundEffects: true,    // 타격음 등 효과음
    bgmEnabled: true,      // 배경음악 재생
    animations: true,      // 피격/사망 등 연출
    customBgmEnabled: false, // 업로드한 파일을 배경음악으로 사용
};

let currentSettings = loadSettings();

function loadSettings() {
    try {
        const raw = localStorage.getItem(SETTINGS_KEY);
        return raw ? { ...DEFAULT_SETTINGS, ...JSON.parse(raw) } : { ...DEFAULT_SETTINGS };
    } catch {
        return { ...DEFAULT_SETTINGS };
    }
}

function getSetting(key) {
    return currentSettings[key];
}

function setSetting(key, value) {
    currentSettings = { ...currentSettings, [key]: value };
    try {
        localStorage.setItem(SETTINGS_KEY, JSON.stringify(currentSettings));
    } catch {
        // 저장 실패는 무시 — 이번 세션 동안은 메모리 값으로 계속 동작한다.
    }
    onSettingChanged(key, value);
}

function onSettingChanged(key, value) {
    const customRow = document.getElementById("customBgmUploadRow");
    if (key === "customBgmEnabled" && customRow) {
        customRow.style.display = value ? "flex" : "none";
    }
    // 대전 도중 배경음악 관련 설정을 바꾸면 즉시 반영한다.
    if ((key === "bgmEnabled" || key === "customBgmEnabled") && match) {
        bgm.stop();
        bgm.start();
    }
}

const PROFILE_KEY = "kkuttmal:profile";

function loadProfile() {
    try {
        const raw = localStorage.getItem(PROFILE_KEY);
        return raw ? JSON.parse(raw) : {};
    } catch {
        return {};
    }
}

function saveProfile(profile) {
    try {
        localStorage.setItem(PROFILE_KEY, JSON.stringify(profile));
    } catch {
        // 무시 — 이번 세션 동안은 메모리 값으로 계속 동작한다.
    }
}

let currentProfile = loadProfile();

/** AI 대전에서 쓸 내 캐릭터 색. 프로필에서 고르지 않았으면 최초 1회 무작위 배정 후 저장한다. */
async function getMyCharacterColor() {
    if (currentProfile.characterColor) return currentProfile.characterColor;
    const { pickRandomAvailableColor } = await getColorModule();
    const picked = pickRandomAvailableColor(new Set());
    currentProfile = { ...currentProfile, characterColor: picked.hex };
    saveProfile(currentProfile);
    return currentProfile.characterColor;
}

function setMyCharacterColor(hex) {
    currentProfile = { ...currentProfile, characterColor: hex };
    saveProfile(currentProfile);
}

    if (!colorModulePromise) colorModulePromise = import("./dist/game/characterColor.js");

}

let healthModulePromise = null;

}

/* ============================================================
   사운드 — 절차적 BGM(다악기) + 타격음("깡!") 합성.
   외부 오디오 에셋은 쓰지 않는다(제공된 트랙이 없고, 라이선스 없는
   음원을 넣을 수 없다). 전부 Web Audio 오실레이터/노이즈로 만든다.
   ============================================================ */

/** 효과음 전용 공유 오디오 컨텍스트 — BGM 이 꺼져 있어도 타격음은 나야 한다. */
let sfxContext = null;
function getSfxContext() {
    if (!sfxContext) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return null;
        sfxContext = new AudioContextClass();
    }
    if (sfxContext.state === "suspended") sfxContext.resume();
    return sfxContext;
}

/** 모루(anvil)에 망치가 부딪히는 듯한 "깡!" 소리 — 금속성 톤 + 임펄스 노이즈. */
function playClangSound(amplitude = 1) {
    if (!getSetting("soundEffects")) return;
    const ctx = getSfxContext();
    if (!ctx) return;
    const now = ctx.currentTime;
    const amp = Math.min(1.6, Math.max(0.3, amplitude));

    [1046.5, 1318.5].forEach((freq, i) => {
        const osc = ctx.createOscillator();
        osc.type = i === 0 ? "square" : "triangle";
        osc.frequency.value = freq * (1 + (Math.random() - 0.5) * 0.02);
        const gain = ctx.createGain();
        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.linearRampToValueAtTime(0.12 * amp, now + 0.005);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.25);
        osc.connect(gain).connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.3);
    });

    const bufferSize = Math.floor(ctx.sampleRate * 0.05);
    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
        data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufferSize, 2);
    }
    const noise = ctx.createBufferSource();
    noise.buffer = buffer;
    const filter = ctx.createBiquadFilter();
    filter.type = "bandpass";
    filter.frequency.value = 2500;
    filter.Q.value = 1.2;
    const noiseGain = ctx.createGain();
    noiseGain.gain.setValueAtTime(0.2 * amp, now);
    noiseGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.06);
    noise.connect(filter).connect(noiseGain).connect(ctx.destination);
    noise.start(now);
}

/**
 * 절차적 BGM — 리드(아르페지오) + 베이스 + 하이햇, 세 목소리로 짠다.
 * 단조로운 삐-소리 하나였던 이전 버전보다 훨씬 풍성하다.
 */
class ProceduralBgm {
    constructor() {
        this.ctx = null;
        this.muted = false;
        this.baseIntervalMs = 260;
        this.speedRatio = 1;
        this.leadTimer = null;
        this.bassTimer = null;
        this.leadStep = 0;
        this.bassStep = 0;
        // 리드: 아르페지오(라 도 레 미 솔 미 레 도, A minor 근방).
        this.leadNotes = [220.0, 261.63, 293.66, 329.63, 392.0, 329.63, 293.66, 261.63];
        // 베이스: 리드보다 한 옥타브 아래, 코드 진행(라-파-도-솔).
        this.bassNotes = [110.0, 87.31, 130.81, 98.0];
        this.hihatEvery = 4;
    }

    start() {
        if (!this.ctx) {
            const AudioContextClass = window.AudioContext || window.webkitAudioContext;
            if (!AudioContextClass) return;
            this.ctx = new AudioContextClass();
        }
        if (this.ctx.state === "suspended") this.ctx.resume();
        this.scheduleLead();
        this.scheduleBass();
    }

    scheduleLead() {
        clearTimeout(this.leadTimer);
        this.leadTimer = setTimeout(() => {
            this.playLeadStep();
            this.scheduleLead();
        }, this.baseIntervalMs / this.speedRatio);
    }

    scheduleBass() {
        clearTimeout(this.bassTimer);
        this.bassTimer = setTimeout(() => {
            this.playBassStep();
            this.scheduleBass();
        }, (this.baseIntervalMs * 2) / this.speedRatio);
    }

    playLeadStep() {
        if (this.muted || !this.ctx) return;
        const freq = this.leadNotes[this.leadStep % this.leadNotes.length];
        this.leadStep += 1;
        this.pluck(freq, "triangle", 0.05, 0.18);
        if (this.leadStep % this.hihatEvery === 0) this.hihat();
    }

    playBassStep() {
        if (this.muted || !this.ctx) return;
        const freq = this.bassNotes[this.bassStep % this.bassNotes.length];
        this.bassStep += 1;
        this.pluck(freq, "sine", 0.09, 0.35);
    }

    pluck(freq, type, peakGain, decaySeconds) {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.0001, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(peakGain, this.ctx.currentTime + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + decaySeconds);
        osc.connect(gain).connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + decaySeconds + 0.05);
    }

    hihat() {
        const bufferSize = Math.floor(this.ctx.sampleRate * 0.03);
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
        const noise = this.ctx.createBufferSource();
        noise.buffer = buffer;
        const filter = this.ctx.createBiquadFilter();
        filter.type = "highpass";
        filter.frequency.value = 6000;
        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(0.03, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + 0.03);
        noise.connect(filter).connect(gain).connect(this.ctx.destination);
        noise.start();
    }

    setSpeedRatio(ratio) {
        this.speedRatio = ratio;
    }

    setMuted(muted) {
        this.muted = muted;
    }

    stop() {
        clearTimeout(this.leadTimer);
        clearTimeout(this.bassTimer);
        this.leadTimer = null;
        this.bassTimer = null;
        if (this.ctx) {
            this.ctx.close().catch(() => {});
            this.ctx = null;
        }
    }
}

/**
 * 배경음악 컨트롤러 — 절차적 합성과, 설정에서 업로드한 커스텀 오디오 파일 중
 * 하나를 골라 재생한다. 배속(playbackRate)은 두 경우 모두 파도타기 배속과
 * 같은 비율로 걸린다. 업로드 파일은 이 브라우저 세션에서만 유지된다(재생 목록에
 * 영속 저장하지 않음 — localStorage 는 대용량 바이너리에 적합하지 않다).
 */
class BgmController {
    constructor() {
        this.procedural = new ProceduralBgm();
        this.audioEl = document.getElementById("customBgmPlayer");
        this.customReady = false;
        this.speedRatio = 1;
        this.muted = false;
    }

    useCustom() {
        return getSetting("customBgmEnabled") && this.customReady;
    }

    start() {
        if (!getSetting("bgmEnabled")) return;
        if (this.useCustom()) {
            this.audioEl.currentTime = 0;
            this.audioEl.playbackRate = Math.min(4, this.speedRatio);
            this.audioEl.muted = this.muted;
            this.audioEl.play().catch(() => {});
        } else {
            this.procedural.start();
        }
    }

    stop() {
        this.procedural.stop();
        if (this.audioEl) this.audioEl.pause();
    }

    setSpeedRatio(ratio) {
        this.speedRatio = ratio;
        this.procedural.setSpeedRatio(ratio);
        // 브라우저별 playbackRate 상한(대략 4~16배)을 넘지 않게 클램프한다.
        if (this.audioEl) this.audioEl.playbackRate = Math.min(4, ratio);
    }

    setMuted(muted) {
        this.muted = muted;
        this.procedural.setMuted(muted);
        if (this.audioEl) this.audioEl.muted = muted;
    }

    /** 업로드한 파일을 로드한다. 재생 가능하면 true, 형식을 지원하지 않으면 false. */
    loadCustomFile(file) {
        return new Promise((resolve) => {
            const url = URL.createObjectURL(file);
            this.customReady = false;
            const cleanup = () => {
                this.audioEl.removeEventListener("canplaythrough", onReady);
                this.audioEl.removeEventListener("error", onError);
            };
            const onReady = () => { this.customReady = true; cleanup(); resolve(true); };
            const onError = () => { this.customReady = false; cleanup(); resolve(false); };
            this.audioEl.addEventListener("canplaythrough", onReady, { once: true });
            this.audioEl.addEventListener("error", onError, { once: true });
            this.audioEl.loop = true;
            this.audioEl.src = url;
            this.audioEl.load();
        });
    }
}

const bgm = new BgmController();

/** entry.sources 가 일반 어휘(korean_dict)만이 아니면 "특수 단어"로 취급한다. */
function isSpecialWord(entry) {
    return entry.sources.some((source) => source !== "korean_dict");
}

/* ============================================================
   캐릭터 — 단어 로그 하단에 배치되는 두 캐릭터. 끝이 둥근 정사각형 몸통에
   눈 2개, 그 아래 체력바. 피격/사망 연출은 순수 함수(damageForTurn/hitPlan,
   src/game/health.ts)가 정한 파라미터를 DOM 애니메이션으로 재생한다.
   ============================================================ */

function renderCharacterMarkup(side, name) {
    return `
        <div class="character-slot" id="character-${side}">
            <div class="character-name">${escapeHtml(name)}</div>
            <div class="character-rig">
                <span class="character-hammer" id="hammer-${side}">🔨</span>
                <div class="character-body" id="body-${side}">
                    <span class="character-eye left"></span>
                    <span class="character-eye right"></span>
                </div>
            </div>
            <div class="character-hp-track">
                <div class="character-hp-fill" id="hpfill-${side}"></div>
            </div>
            <div class="character-hp-label" id="hplabel-${side}">100 / 100</div>
        </div>
    `;
}

function applyCharacterColor(side, hex, eyeColor) {
    const body = document.getElementById(`body-${side}`);
    if (!body) return;
    body.style.setProperty("--character-color", hex);
    body.style.setProperty("--character-eye-color", eyeColor || "#ffffff");
}

function updateCharacterHp(side, hp, maxHp) {
    const fill = document.getElementById(`hpfill-${side}`);
    const label = document.getElementById(`hplabel-${side}`);
    if (!fill || !label) return;
    const ratio = Math.max(0, Math.min(1, hp / maxHp));
    fill.style.width = `${ratio * 100}%`;
    fill.classList.toggle("mid", ratio <= 0.5 && ratio > 0.2);
    fill.classList.toggle("low", ratio <= 0.2);
    label.textContent = `${Math.max(0, Math.round(hp))} / ${maxHp}`;
}

function sleep(ms) {
    return new Promise((resolve) => setTimeout(resolve, ms));
}

/**
 * 피격 연출 한 번. hitPlan 이 정한 대로 20 이하 대미지는 망치로 빠르게 여러 번,
 * 20 초과는 크고 세게 한 번 때린다. 애니메이션이 완전히 끝날 때까지 기다렸다가
 * resolve 한다 — 이걸 기다린 뒤에야 다음 라운드가 시작된다.
 */
async function playDamageSequence(side, damage) {
    const { hitPlan, estimateHitSequenceMs } = await getHealthModule();
    const plan = hitPlan(damage);
    const animationsOn = getSetting("animations");
    const body = document.getElementById(`body-${side}`);
    const hammer = document.getElementById(`hammer-${side}`);

    if (!animationsOn) {
        playClangSound(1);
        await sleep(150);
        return;
    }

    const strike = (amplitude, durationMs) => {
        if (body) {
            body.style.setProperty("--hit-amp", amplitude);
            body.style.setProperty("--hit-duration", `${durationMs}ms`);
            body.classList.remove("hit");
            void body.offsetWidth; // 강제 리플로우 — 애니메이션 재시작.
            body.classList.add("hit");
        }
        if (hammer) {
            hammer.style.setProperty("--hit-amp", amplitude);
            hammer.style.setProperty("--hit-duration", `${durationMs}ms`);
            hammer.classList.remove("swing");
            void hammer.offsetWidth;
            hammer.classList.add("swing");
        }
    };

    if (!plan.heavy) {
        for (let i = 0; i < plan.hits; i += 1) {
            strike(plan.amplitude, plan.intervalMs);
            playClangSound(0.6 + i * 0.05);
            await sleep(plan.intervalMs);
        }
    } else {
        // health.ts 의 estimateHitSequenceMs 와 같은 공식 — 20 초과 피해는
        // 항상 1초 이상 걸리고, 대미지(amplitude)가 클수록 더 길어진다.
        const durationMs = estimateHitSequenceMs(plan);
        strike(plan.amplitude, durationMs);
        playClangSound(Math.min(1.6, plan.amplitude));
        await sleep(durationMs);
    }
}

/** 체력이 0 이하가 됐을 때: 허접하지만 역동적인 발작 -> 적색화 -> 폭발. */
async function playDeathSequence(side) {
    const slot = document.getElementById(`character-${side}`);
    const body = document.getElementById(`body-${side}`);
    const animationsOn = getSetting("animations");

    playClangSound(1.8);

    if (!animationsOn || !body || !slot) {
        await sleep(200);
        if (slot) slot.classList.add("defeated");
        return;
    }

    body.classList.add("dying");
    await sleep(770);
    body.classList.remove("dying");

    // 폭발은 모달의 overflow: auto 클리핑 밖으로 나가야 한다("무빙이 굳이
    // 창 안에 갇혀 있을 필요는 없어") — 슬롯 전체를 body 로 옮기고 현재
    // 화면 좌표에 position: fixed 로 고정한 뒤, 매번 다른 무작위 방향으로
    // 화면을 가로질러 날려버린다.
    const rect = slot.getBoundingClientRect();
    slot.style.position = "fixed";
    slot.style.left = `${rect.left}px`;
    slot.style.top = `${rect.top}px`;
    slot.style.width = `${rect.width}px`;
    slot.style.margin = "0";
    slot.style.zIndex = "9999";
    document.body.appendChild(slot);

    const flyAngle = Math.random() * Math.PI * 2;
    const flyDistance = Math.max(window.innerWidth, window.innerHeight) * 0.75;
    slot.style.setProperty("--fly-x", `${Math.cos(flyAngle) * flyDistance}px`);
    slot.style.setProperty("--fly-y", `${Math.sin(flyAngle) * flyDistance - 160}px`);

    spawnExplosionShards(slot, getComputedStyle(body).getPropertyValue("--character-color") || "#f0d9e4");
    slot.classList.add("exploding");
    await sleep(650);
    slot.remove();
}

function spawnExplosionShards(slot, color) {
    const rig = slot.querySelector(".character-rig");
    if (!rig) return;
    for (let i = 0; i < 7; i += 1) {
        const shard = document.createElement("span");
        shard.className = "character-shard";
        const angle = (Math.PI * 2 * i) / 7 + Math.random() * 0.6;
        const distance = 40 + Math.random() * 30;
        shard.style.setProperty("--shard-x", `${Math.cos(angle) * distance}px`);
        shard.style.setProperty("--shard-y", `${Math.sin(angle) * distance}px`);
        shard.style.background = color;
        rig.appendChild(shard);
        setTimeout(() => shard.remove(), 520);
    }
}

async function startAiMatch(difficulty) {
    const { turnDurationSeconds, paceSpeedRatio } = await getPaceModule();
    const { MAX_HP } = await getHealthModule();
    const { paletteColorOf } = await getColorModule();
    const handle = await getDictionaryHandle();
    const starter = handle.dictionary.randomStartWord();

    if (!starter) {
        openModal("AI MODE", `<div class="modal-panel">사전이 비어 있어 매치를 시작할 수 없습니다.</div>`);
        return;
    }

    const myColor = paletteColorOf(await getMyCharacterColor());
    // AI 는 내 색과 겹치지 않는 색을 무작위로 받는다(로비 색상 규칙과 같은 원리).
    const { pickRandomAvailableColor } = await getColorModule();
    const aiColor = pickRandomAvailableColor(new Set([myColor.hex])) ?? paletteColorOf("#1d2327");

    match = {
        difficulty,
        dictionary: handle.dictionary,
        turn: 1,
        maxHp: MAX_HP,
        playerHp: MAX_HP,
        aiHp: MAX_HP,
        used: new Set([starter.word]),
        current: starter,
        log: [{ entry: starter, side: "start" }],
        phase: "player",
        timerId: null,
        deadline: 0,
        muted: false,
        playerColor: myColor,
        aiColor,
    };

    document.querySelector(".modal")?.classList.add("match-modal");
    renderMatchScreen();
    bgm.start();
    applyPace(paceSpeedRatio);
    beginPlayerTurn(turnDurationSeconds);
}

function applyPace(paceSpeedRatio) {
    const ratio = paceSpeedRatio(match.turn);
    bgm.setSpeedRatio(ratio);
    document.documentElement.style.setProperty("--pace-ratio", String(ratio));
}

function renderMatchScreen() {
    const content = document.getElementById("modalContent");
    if (!content) return;
    modalTitle.textContent = `AI MODE · ${DIFFICULTY_LABEL[match.difficulty]}`;

    content.innerHTML = `
        <div class="modal-panel">
            <div class="match-hud">
                <span id="matchTurnNumber">턴 ${match.turn}</span>
                <span class="match-speed" id="matchSpeed">1.0배속</span>
                <button class="match-bgm-toggle" id="matchBgmToggle">🔊 BGM</button>
            </div>

            <div class="match-timer-track">
                <div class="match-timer-fill" id="matchTimerFill" style="transform: scaleX(1);"></div>
            </div>

            <div class="match-word-stage">
                <div class="match-turn-label" id="matchTurnLabel">플레이어 턴</div>
                <div class="match-current-word" id="matchCurrentWord"></div>
                <div class="match-status" id="matchStatus"></div>
            </div>

            <div class="match-input-row">
                <input id="matchInput" type="text" placeholder="다음 단어를 입력…" autocomplete="off">
                <button class="primary-button" id="matchSubmit">제출</button>
            </div>

            <div class="match-log" id="matchLog"></div>

            <div class="character-stage">
                ${renderCharacterMarkup("player", "플레이어")}
                ${renderCharacterMarkup("ai", `AI · ${DIFFICULTY_LABEL[match.difficulty]}`)}
            </div>

            <div id="matchResult"></div>
        </div>
    `;

    document.getElementById("matchBgmToggle").addEventListener("click", (event) => {
        match.muted = !match.muted;
        bgm.setMuted(match.muted);
        event.currentTarget.textContent = match.muted ? "🔇 BGM" : "🔊 BGM";
    });
    document.getElementById("matchSubmit").addEventListener("click", submitMatchWord);
    document.getElementById("matchInput").addEventListener("keydown", (event) => {
        if (event.key === "Enter") submitMatchWord();
    });

    applyCharacterColor("player", match.playerColor.hex, match.playerColor.eyeColor);
    applyCharacterColor("ai", match.aiColor.hex, match.aiColor.eyeColor);
    updateCharacterHp("player", match.playerHp, match.maxHp);
    updateCharacterHp("ai", match.aiHp, match.maxHp);
    renderCurrentWord();
    renderLog();
}

function renderCurrentWord() {
    const el = document.getElementById("matchCurrentWord");
    if (!el) return;
    const word = match.current.word;
    el.innerHTML = `${escapeHtml(word.slice(0, -1))}<span class="match-hint-char">${escapeHtml(word.slice(-1))}</span>`;
}

function renderLog() {
    const el = document.getElementById("matchLog");
    if (!el) return;
    el.innerHTML = match.log
        .map(({ entry, side }) => {
            const cls = ["match-log-word"];
            if (side === "ai") cls.push("ai");
            if (isSpecialWord(entry)) cls.push("special");
            // 마우스 올리면 뜻(lore) 이 보이도록 — "단어 로그에 마우스 올려놓으면
            // 설명 나오도록" 요구사항.
            const title = escapeHtml(entry.lore || "");
            return `<span class="${cls.join(" ")}" title="${title}">${escapeHtml(entry.word)}</span>`;
        })
        .join("");
    el.scrollLeft = el.scrollWidth;
}

// 특수 단어 펄스 애니메이션 속도. CSS 쪽 --pace-ratio 커스텀 프로퍼티(applyPace() 가 갱신)를
// calc() 로 나눠 쓰므로, 여기서는 표시용 배속 텍스트("N.N배속")를 위해서만 값을 들고 있는다.
let currentPaceRatioCache = 1;

function setStatus(message) {
    const el = document.getElementById("matchStatus");
    if (el) el.textContent = message;
}

async function beginPlayerTurn(turnDurationSecondsFn) {
    if (!match || match.phase === "over") return;
    match.phase = "player";
    document.getElementById("matchTurnLabel").textContent = "플레이어 턴";
    document.getElementById("matchInput").disabled = false;
    document.getElementById("matchSubmit").disabled = false;
    document.getElementById("matchInput").focus();
    setStatus("");
    runTimer(turnDurationSecondsFn(match.turn), () => handlePlayerTimeout(turnDurationSecondsFn));
}

function runTimer(durationSeconds, onExpire) {
    cancelAnimationFrame(match.timerId);
    const fill = document.getElementById("matchTimerFill");
    const total = durationSeconds * 1000;
    const start = performance.now();
    match.deadline = start + total;

    const step = () => {
        if (!match || match.phase === "over") return;
        const remaining = match.deadline - performance.now();
        const ratio = Math.max(0, remaining / total);
        if (fill) {
            fill.style.transform = `scaleX(${ratio})`;
            fill.classList.toggle("urgent", ratio < 0.3);
        }
        if (remaining <= 0) {
            onExpire();
            return;
        }
        match.timerId = requestAnimationFrame(step);
    };
    match.timerId = requestAnimationFrame(step);
}

function stopTimer() {
    if (match?.timerId) cancelAnimationFrame(match.timerId);
}

/**
 * 대전 중 단어 판정은 오직 로컬 사전(match.dictionary)만 본다 — 온라인 검색을
 * 절대 타지 않는다. Map 조회 몇 번뿐이라 사실상 즉시(0.1초는커녕 1ms 미만) 끝나고,
 * 플레이어와 AI 가 정확히 같은 단어 풀을 놓고 겨루게 돼 공평하다(온라인 검색을
 * 쓰면 플레이어만 사전 밖 단어를 쓸 수 있어 AI 가 부당하게 불리해진다).
 * 사전에 없는 실재하는 단어를 확인하고 싶을 땐 DICTIONARY 창의 검색을 쓰면 되고,
 * 거기서 확인된 단어는 즉시 학습되어(BrowserDictionary.learn) 다음 대전부터는
 * 이 로컬 사전에도 already known 상태로 남는다.
 */
function validateLocalTurn(dictionary, rawWord, { previous, used } = {}) {
    const word = (rawWord ?? "").trim();
    if ([...word].length < 2) {
        return {
            valid: false,
            code: "invalid_word",
            message: `최소 길이 2자 미만 (${[...word].length}자)`,
        };
    }

    const found = dictionary.get(word);
    if (!found) {
        return { valid: false, code: "unknown_word", message: "사전에 없는 단어입니다." };
    }
    if (used?.has(found.word)) {
        return { valid: false, code: "already_used", message: "이미 사용한 단어입니다.", entry: found };
    }
    if (previous && !dictionary.canFollow(previous, found.word)) {
        const previousEntry = dictionary.get(previous);
        return {
            valid: false,
            code: "not_chained",
            message: `'${previousEntry ? previousEntry.last : ""}'(으)로 시작하는 단어가 아닙니다.`,
            entry: found,
        };
    }
    if (!getSetting("oneShotWords") && dictionary.isDeadEnd(found.word)) {
        return {
            valid: false,
            code: "one_shot_blocked",
            message: "한방단어는 허용되지 않습니다(설정에서 켤 수 있어요).",
            entry: found,
        };
    }
    return { valid: true, code: "ok", message: "통과", entry: found };
}

/**
 * 오답/미등록/이미 사용/한방단어 금지 등 "형식상 실패"는 라운드를 끝내지 않는다.
 * 시간도 그대로 흐르고 체력도 깎이지 않는다 — 그냥 메시지만 보여주고 같은
 * 단어(같은 타이머)로 다시 시도할 수 있게 둔다. 오직 타임아웃(handlePlayerTimeout)
 * 만이 라운드를 끝낸다("단어를 한번 잘못 입력해도 시간은 그대로 가고 체력도
 * 깎이면 안돼. 라운드가 종료되는 기준은 타임아웃으로 인해 입력하지 못했을 때야").
 */
function submitMatchWord() {
    if (!match || match.phase !== "player") return;
    const input = document.getElementById("matchInput");
    const word = input.value.trim();
    if (!word) return;

    const validation = validateLocalTurn(match.dictionary, word, {
        previous: match.current.word,
        used: match.used,
    });

    if (!validation.valid) {
        setStatus(validation.message);
        input.value = "";
        input.focus();
        return;
    }

    stopTimer();
    document.getElementById("matchInput").disabled = true;
    document.getElementById("matchSubmit").disabled = true;
    void acceptPlayerWord(validation.entry);
}

/** 플레이어가 유효한 단어를 냈을 때 — 체인을 이어가고 AI 턴으로 넘긴다. */
async function acceptPlayerWord(entry) {
    const session = match;
    const { turnDurationSeconds, paceSpeedRatio } = await getPaceModule();
    if (match !== session) return;

    acceptWord(entry, "player");
    match.turn += 1;
    applyPace(paceSpeedRatio);
    updateSpeedLabel(paceSpeedRatio);
    renderCurrentWord();
    document.getElementById("matchTurnLabel").textContent = "AI 턴 · 생각 중…";
    document.getElementById("matchInput").value = "";
    match.phase = "ai";
    setStatus("");
    void runAiTurn(turnDurationSeconds, paceSpeedRatio);
}

/**
 * 타임아웃(제한 시간 안에 아무 단어도 못 냄) — 유일하게 라운드를 끝내는 사건이다.
 * 대미지를 입고(그 시점의 turn 기준), 죽지 않았다면 단어/턴/배속을 전부 처음
 * 상태로 리셋한 뒤 새 라운드를 시작한다.
 */
async function handlePlayerTimeout(turnDurationSecondsFn) {
    const session = match;
    if (!session || session.phase === "over") return;
    document.getElementById("matchInput").disabled = true;
    document.getElementById("matchSubmit").disabled = true;

    // 라운드 전환 전체(피격 연출 + 리셋 + 재배열 + 다음 라운드 시작)를 이 시각
    // 기준으로 여유 있게 페이싱한다 — "정신없다, 한 5초 정도로" 요구사항.
    const transitionStart = performance.now();

    const { paceSpeedRatio } = await getPaceModule();
    if (match !== session) return;
    const { damageForTurn, ROUND_TRANSITION_MS } = await getHealthModule();
    if (match !== session) return;

    const damage = damageForTurn(match.turn);
    match.playerHp = Math.max(0, match.playerHp - damage);
    setStatus(`시간 초과! (-${damage})`);

    await playDamageSequence("player", damage);
    if (match !== session) return;
    updateCharacterHp("player", match.playerHp, match.maxHp);

    if (match.playerHp <= 0) {
        await playDeathSequence("player");
        if (match !== session) return;
        endMatch(false, "시간 초과!");
        return;
    }

    await resetRoundForTimeout(session, turnDurationSecondsFn, paceSpeedRatio, transitionStart, ROUND_TRANSITION_MS);
}

/**
 * transitionStart(타임아웃이 발생한 시각)로부터 roundTransitionMs * ratio 시점까지
 * 남은 시간만큼 기다린다. 피격 연출이 이미 그 시점을 넘겨버렸으면(대미지가 아주 커서
 * heavy 히트가 오래 걸린 경우 등) 아주 짧게만 쉬고 넘어간다 — 무리하게 시간을
 * 맞추려 들지 않고, 최소한의 여유만 보장한다.
 */
async function pacedWait(transitionStart, roundTransitionMs, ratio) {
    const targetElapsed = roundTransitionMs * ratio;
    const elapsed = performance.now() - transitionStart;
    await sleep(Math.max(150, targetElapsed - elapsed));
}

/**
 * 라운드 리셋: 새 무작위 시작 단어, 턴 1로 복귀, 배속/제한시간 원래대로.
 * 재배열 모션이 끝난 뒤에야 다음 라운드가 시작된다("대미지 및 사망 모션이
 * 끝나고 재배열 모션, 그리고 새로운 라운드 시작"). 타임아웃으로 라운드를
 * 날린 쪽은 그 턴을 "쓴" 것으로 치고, 다음 라운드는 상대(AI) 턴부터 시작한다.
 * 전체 과정은 pacedWait 으로 여유 있게 늘여서 약 ROUND_TRANSITION_MS(기본 5초)에
 * 걸치도록 한다.
 */
async function resetRoundForTimeout(session, turnDurationSecondsFn, paceSpeedRatio, transitionStart, roundTransitionMs) {
    setStatus("라운드 종료! 잠시 후 새 단어로 다시 시작합니다…");

    // 결과(피격 이펙트, 체력 변화)를 충분히 보여줄 시간을 준 뒤에야 새 단어를 고른다.
    await pacedWait(transitionStart, roundTransitionMs, 0.55);
    if (match !== session) return;

    const handle = await getDictionaryHandle();
    if (match !== session) return;
    const starter = handle.dictionary.randomStartWord();
    if (!starter) {
        endMatch(false, "사전에서 더 이상 시작 단어를 찾을 수 없습니다.");
        return;
    }

    match.turn = 1;
    match.used = new Set([starter.word]);
    match.current = starter;
    match.log = [{ entry: starter, side: "start" }];
    applyPace(paceSpeedRatio);
    updateSpeedLabel(paceSpeedRatio);
    renderCurrentWord();
    renderLog();

    await playReorderByHp();
    if (match !== session) return;

    // 재배열까지 끝난 새 라운드를 잠깐 눈에 담을 시간을 준 뒤에야 다음 턴으로 넘어간다.
    await pacedWait(transitionStart, roundTransitionMs, 1);
    if (match !== session) return;

    setStatus("");
    document.getElementById("matchTurnLabel").textContent = "AI 턴 · 생각 중…";
    match.phase = "ai";
    void runAiTurn(turnDurationSecondsFn, paceSpeedRatio);
}

/**
 * 라운드가 끝날 때마다 체력이 높은 순서대로 캐릭터를 재배열한다(FLIP 기법):
 * 옮기기 전 위치를 기록해 두고, DOM 순서를 바꾼 뒤 이전 위치에서 새 위치로
 * transform 트랜지션을 건다.
 */
async function playReorderByHp() {
    const stage = document.querySelector(".character-stage");
    if (!stage || !match) return;
    const slots = [...stage.querySelectorAll(".character-slot")];
    if (slots.length < 2) return;

    const hpOf = (slot) => {
        const side = slot.id.replace("character-", "");
        return side === "player" ? match.playerHp : match.aiHp;
    };

    const sorted = [...slots].sort((a, b) => hpOf(b) - hpOf(a));
    const sameOrder = sorted.every((slot, index) => slot === slots[index]);
    if (sameOrder) return;

    if (!getSetting("animations")) {
        sorted.forEach((slot) => stage.appendChild(slot));
        return;
    }

    const before = new Map(slots.map((slot) => [slot, slot.getBoundingClientRect()]));
    sorted.forEach((slot) => stage.appendChild(slot));

    for (const slot of sorted) {
        const from = before.get(slot);
        const to = slot.getBoundingClientRect();
        const dx = from.left - to.left;
        const dy = from.top - to.top;
        if (!dx && !dy) continue;
        slot.classList.remove("reordering");
        slot.style.transform = `translate(${dx}px, ${dy}px)`;
        void slot.offsetWidth; // 강제 리플로우.
        slot.classList.add("reordering");
        slot.style.transform = "";
    }

    await sleep(480);
    for (const slot of sorted) {
        slot.classList.remove("reordering");
        slot.style.transform = "";
    }
}

function acceptWord(entry, side) {
    match.used.add(entry.word);
    match.current = entry;
    match.log.push({ entry, side });
    renderLog();
}

function updateSpeedLabel(paceSpeedRatio) {
    currentPaceRatioCache = paceSpeedRatio(match.turn);
    const el = document.getElementById("matchSpeed");
    if (el) el.textContent = `${currentPaceRatioCache.toFixed(1)}배속`;
    const turnEl = document.getElementById("matchTurnNumber");
    if (turnEl) turnEl.textContent = `턴 ${match.turn}`;
}

async function runAiTurn(turnDurationSecondsFn, paceSpeedRatio) {
    const session = match; // acceptPlayerWord/handlePlayerTimeout 와 같은 이유로 세션을 붙잡아둔다.
    const { chooseAiMove } = await getAiModule();
    if (match !== session) return;
    const duration = turnDurationSecondsFn(match.turn);

    // 실제 오디오/타이머 배속과 같은 비율로 AI의 "생각 시간"도 짧아진다 —
    // 다만 항상 제한 시간 안에 수를 결정해 타임아웃으로 지지는 않는다.
    const thinkMs = Math.min(1100, duration * 1000 * 0.55);
    runTimer(duration, () => {}); // 시각적 타이머만 계속 보여준다(AI 는 타임아웃으로 지지 않음).

    await new Promise((resolve) => setTimeout(resolve, thinkMs));
    if (match !== session || match.phase !== "ai") return;

    const move = chooseAiMove(match.dictionary, match.current.word, {
        difficulty: match.difficulty,
        exclude: match.used,
        allowDeadEnd: getSetting("oneShotWords"),
    });

    stopTimer();

    if (!move) {
        // AI 가 이을 단어를 못 찾음 = 즉시 전멸(체력 0) — 사망 연출을 재생한 뒤 종료한다.
        match.aiHp = 0;
        updateCharacterHp("ai", 0, match.maxHp);
        await playDeathSequence("ai");
        if (match !== session) return;
        endMatch(true, "AI 가 더 이상 이을 단어를 찾지 못했습니다!");
        return;
    }

    acceptWord(move, "ai");
    match.turn += 1;
    applyPace(paceSpeedRatio);
    updateSpeedLabel(paceSpeedRatio);
    renderCurrentWord();
    beginPlayerTurn(turnDurationSecondsFn);
}

function endMatch(playerWon, reason) {
    stopTimer();
    if (!match) return;
    match.phase = "over";
    document.getElementById("matchInput").disabled = true;
    document.getElementById("matchSubmit").disabled = true;
    document.getElementById("matchTurnLabel").textContent = playerWon ? "승리!" : "패배";
    setStatus("");

    const result = document.getElementById("matchResult");
    if (result) {
        result.innerHTML = `
            <div class="match-result ${playerWon ? "win" : "lose"}">
                <h4>${playerWon ? "승리했습니다" : "패배했습니다"}</h4>
                <p>${escapeHtml(reason ?? "")}</p>
                <div class="match-result-actions">
                    <button class="primary-button" id="matchRematch">다시 하기</button>
                    <button class="close-button" id="matchQuit">×</button>
                </div>
            </div>
        `;
        document.getElementById("matchRematch").addEventListener("click", () => {
            const difficulty = match.difficulty;
            stopMatch();
            startAiMatch(difficulty);
        });
        document.getElementById("matchQuit").addEventListener("click", () => {
            stopMatch();
            closeModal();
        });
    }
}

/** 매치 진행 중에 모달이 닫히면(X, 배경 클릭) 타이머/BGM 을 확실히 정리한다. */
function stopMatch() {
    stopTimer();
    bgm.stop();
    document.documentElement.style.removeProperty("--pace-ratio");
    document.querySelector(".modal")?.classList.remove("match-modal");
    match = null;
}

   ============================================================ */

const backdrop = document.getElementById("modalBackdrop");
const modalTitle = document.getElementById("modalTitle");
const modalContent = document.getElementById("modalContent");

function openModal(title, html) {
    modalTitle.textContent = title;
    modalContent.innerHTML = html;
    backdrop.classList.add("open");

    initSettingsToggles();
    initProfileModal();

    // The dictionary search UI only exists inside the "dictionary" template,
    // so detect it by its input element rather than threading a modal key
    // through every openModal() call site (multiplayer/AI reuse this too).
    if (document.getElementById("dictionaryInput")) {
        initDictionaryModal();
    }
}

/** 설정 창의 모든 [data-setting] 토글을 실제 저장된 값과 동기화하고 클릭에 반응하게 한다. */
function initSettingsToggles() {
    document.querySelectorAll("[data-setting]").forEach((button) => {
        const key = button.dataset.setting;
        const apply = (value) => {
            button.classList.toggle("on", !!value);
            button.textContent = value ? "켜짐" : "꺼짐";
        };
        apply(getSetting(key));
        button.onclick = () => {
            const next = !getSetting(key);
            apply(next);
            setSetting(key, next);
        };
    });

    const customRow = document.getElementById("customBgmUploadRow");
    if (customRow) {
        customRow.style.display = getSetting("customBgmEnabled") ? "flex" : "none";
    }

    const fileInput = document.getElementById("customBgmFileInput");
    const fileNameLabel = document.getElementById("customBgmFileName");
    if (fileInput && fileNameLabel) {
        fileInput.onchange = async () => {
            const file = fileInput.files?.[0];
            if (!file) return;
            fileNameLabel.textContent = `"${file.name}" 불러오는 중…`;
            const ok = await bgm.loadCustomFile(file);
            fileNameLabel.textContent = ok
                ? `"${file.name}" 선택됨`
                : `"${file.name}" 은(는) 재생할 수 없는 형식입니다. mp3/wav/ogg 를 사용해 주세요.`;
            if (ok && match && getSetting("customBgmEnabled")) {
                bgm.stop();
                bgm.start();
            }
        };
    }
}

/** 프로필 창의 캐릭터 색상 팔레트를 그리고 클릭 시 저장한다(AI 대전에서 쓸 색). */
async function initProfileModal() {
    const grid = document.getElementById("profileColorGrid");
    if (!grid) return;

    const { CHARACTER_PALETTE, paletteColorOf } = await getColorModule();
    const myColor = paletteColorOf(await getMyCharacterColor());

    grid.innerHTML = CHARACTER_PALETTE
        .map((color) => `
            <button
                class="profile-color-swatch ${color.hex === myColor.hex ? "selected" : ""}"
                data-hex="${color.hex}"
                style="background:${color.hex};"
                aria-label="${color.hex}"
            ></button>
        `)
        .join("");

    grid.querySelectorAll("[data-hex]").forEach((swatch) => {
        swatch.addEventListener("click", () => {
            setMyCharacterColor(swatch.dataset.hex);
            grid.querySelectorAll(".profile-color-swatch").forEach((el) => {
                el.classList.toggle("selected", el.dataset.hex === swatch.dataset.hex);
            });
        });
    });
}

function closeModal() {
    // 매치 도중 X/배경 클릭으로 닫으면 타이머와 절차적 BGM 을 반드시 정리한다 —
    // 안 그러면 모달을 닫아도 오디오 스케줄러가 백그라운드에서 계속 돈다.
    if (match) stopMatch();
    backdrop.classList.remove("open");
}

document.getElementById("closeModal").addEventListener("click", closeModal);

backdrop.addEventListener("click", (event) => {
    if (event.target === backdrop) {
        closeModal();
    }
});

document.querySelectorAll("[data-modal]").forEach((button) => {
    button.addEventListener("click", () => {
        const key = button.dataset.modal;

        const titles = {
            dictionary: "사전",
            tutorial: "튜토리얼",
            profile: "프로필",
            settings: "설정",
            patch: "패치 노트"
        };

        openModal(titles[key], modalTemplates[key]);
    });
});

    "click",
    openMultiplayer
);

document.getElementById("aiButton").addEventListener(

    openAI

/* ============================================================
   SECRET EASTER EGG
   Trigger:
       19911018mafumafu

   Rules:
   - No notification.
   - No sound.
   - Typing the sequence again disables it.
   - When active, UI colors are replaced.
   - When active, room creation must use 19911018.
   ============================================================ */

let easterEggBuffer = "";
let lastInputTime = 0;
const easterEggCode = "19911018mafumafu";

document.addEventListener("keydown", (event) => {

    const now = Date.now();

    if (now - lastInputTime > 5000) {
        easterEggBuffer = "";
    }

    lastInputTime = now;

    if (event.key.length !== 1) {
        return;
    }

    easterEggBuffer += event.key.toLowerCase();

    if (easterEggBuffer.length > easterEggCode.length) {
        easterEggBuffer =
            easterEggBuffer.slice(-easterEggCode.length);
    }

    if (easterEggBuffer === easterEggCode) {

        document.body.classList.toggle("secret");

        // No visible notification.
        // No audio.
        // Only the theme state changes.

        easterEggBuffer = "";
    }
});
